name: CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python-version }}'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          pip install -e .
      - name: Lint critical syntax & undefined names
        run: ruff check . --select F,E9
      - name: CLI smoke tests
        run: |
          python -m xh_aegis.cli --version
          python -m xh_aegis.cli --help > /dev/null
          python -m xh_aegis.cli --auto-demo > /dev/null
      - name: Run unit & counterfactual falsification tests
        run: python -m unittest discover -s tests -v
